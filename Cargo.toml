[workspace]
resolver = "2"
members = [
    "crates/nexus-contracts",
    "crates/nexus-domain",
    "crates/nexus-identity",
    "crates/nexus-presence",
    "crates/nexus-data",
    "crates/nexus-memory",
    "crates/nexus-events",
    "crates/nexus-auth",
    "crates/nexus-policy",
    "crates/nexus-action-gateway",
    "infra/nats",
    "infra/keycloak",
    "infra/openfga",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.97.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
