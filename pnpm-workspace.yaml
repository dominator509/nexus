packages:
  - "packages/*"
  - "infra/*"
  - "installers"
  - "offline-bundle"
  - "release-evidence"
  - "tests/workflows"
  - "tests/e2e/web"
  - "tests/accessibility/web"
  - "tests/onboarding"
  - "tests/livefire/deployment"
  - "tests/release"
  - "apps/web"
  - "apps/desktop"
  - "apps/setup"
# protobufjs is pulled transitively by @temporalio/proto@1.17.2; the
# resolved 7.5.5 carries 11 advisories (GHSA-66ff-xgx4-vchm,
# GHSA-75px-5xx7-5xc7, GHSA-jvwf-75h9-cwgg, GHSA-685m-2w69-288q,
# GHSA-wcpc-wj8m-hjx6, GHSA-2pr8-phx7-x9h3, GHSA-fx83-v9x8-x52w,
# GHSA-q6x5-8v7m-xcrf, GHSA-jggg-4jg4-v7c6, GHSA-f38q-mgvj-vph7,
# GHSA-j3f2-48v5-ccww). The latest advisory requires >=7.6.5, so the
# override pins the patched 7.x line. API-compatible minor bump within
# the 7.x series; EP-006 M4 security gate fix (no allowlist).
# fast-uri is pulled transitively by ajv/ajv-formats/ajv-keywords under
# @temporalio/worker tooling (webpack > schema-utils). The resolved
# 3.1.5 carries 4 high advisories (GHSA-5jgf-p345-68v8 host confusion,
# GHSA-f65p-4m7j-42xc SSRF via malformed IPv6, GHSA-fph4-wmhf-6fwf SSRF
# via repeated percent-decoding, GHSA-jqff-g426-hqxp host confusion via
# percent-encoded scheme). All require >=3.1.6; the override pins the
# patched 3.1.x line (AUD-090 gate verification, no allowlist).
overrides:
  protobufjs: ">=7.6.5 <8"
  fast-uri: ">=3.1.6 <4"
allowBuilds:
  esbuild: true
  protobufjs: true
  "@swc/core": true
