[package]
name = "nexus-imap-smtp"
version = "0.1.0"
edition = "2021"
description = "EP-026 M4 IMAP/SMTP connector: real IMAP read transport and SMTP submission transport against real protocol servers, canonical mapping, separate read/send/modify authorities, forced-failure plane, bounded redacted observability (SPEC-014)"
license = "MIT"

[dependencies]
nexus-email = { path = "../../crates/nexus-email", version = "0.1.0" }
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# Real IMAP protocol client (mature, RFC 3501; MIT/Apache-2.0).
# 3.0.0-alpha.15 is required: 2.4.1 pulls imap-proto -> nom 5.1.3 ->
# lexical-core 0.7.6 (RUSTSEC-2023-0086, unpatched, fails the strict
# security gate). The 3.x line uses imap-proto 0.16 + nom 7 and has
# no such dependency; it keeps the native-tls TLS feature and the
# caller-owned-stream API used by the M4 transport.
imap = { version = "3.0.0-alpha.15", features = ["native-tls"] }
# imap_proto types (BodyStructure) for real BODYSTRUCTURE attachment
# enumeration; same 0.16.7 line already locked via imap 3.0.0-alpha.15.
imap-proto = "0.16.7"
native-tls = "0.2"
# Real SMTP submission client (mature, RFC 5321; MIT/Apache-2.0).
# rustls feature + ring provider + webpki-roots (workspace rustls 0.23 line).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "webpki-roots"] }
# sha256 digest for Attachment/body evidence (workspace sha2 0.11 line).
sha2 = "0.11"

[dev-dependencies]
# Integration tests build canonical vocabulary values directly.
nexus-email = { path = "../../crates/nexus-email", version = "0.1.0" }
serde_json.workspace = true
# sha256 digest for Attachment artifact evidence (SPEC-014 inputs/outputs:
# artifacts carry a digest, never raw content). Aligned with the workspace
# sha2 0.11 line.
sha2 = "0.11"
