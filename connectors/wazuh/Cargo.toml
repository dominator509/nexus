[package]
name = "nexus-wazuh-connector"
version = "0.1.0"
edition = "2021"
description = "EP-031 Wazuh connector: endpoint-profile telemetry adapter behind the nexus-sentinel-advanced EndpointTelemetryProvider port, with forced-failure proofs and observability (SPEC-013)"
license = "MIT"

[dependencies]
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
nexus-sentinel = { path = "../../crates/nexus-sentinel", version = "0.1.0" }
nexus-sentinel-advanced = { path = "../../infra/sentinel/advanced", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# Real Wazuh server API HTTP transport (SPEC-013: Endpoint profile adds
# Wazuh or osquery; COMPONENT_REGISTRY external sensor, GPL-2.0). reqwest
# is the locked workspace dependency class (EP-011/EP-024/EP-026/EP-027/
# EP-028/EP-029/EP-030/EP-031 precedent).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
