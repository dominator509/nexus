[package]
name = "nexus-postiz-connector"
version = "0.1.0"
edition = "2021"
description = "EP-029 M2 Postiz adapter core: real Postiz public API transport, dual-gate governed publish, single-objective enforcement, idempotency, observability (SPEC-015)"
license = "MIT"

[dependencies]
nexus-social = { path = "../../crates/nexus-social", version = "0.1.0" }
nexus-hydra = { path = "../../crates/nexus-hydra", version = "0.1.0" }
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# Real Postiz public API HTTP transport (Postiz is the documented AGPL
# sidecar for scheduling and connector breadth; Nexus orchestrates its
# authenticated public API and normalizes provider payloads at the
# infrastructure boundary). reqwest is the locked workspace dependency
# class (EP-011/EP-024/EP-026/EP-027/EP-028 precedent).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
