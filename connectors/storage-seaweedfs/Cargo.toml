[package]
name = "nexus-provider-storage-seaweedfs"
version = "0.1.0"
edition = "2021"
description = "EP-037 M4 SeaweedFS ArtifactStore adapter (SPEC-024): real S3-gateway transport (AWS SigV4 over std::net), content-addressed with hash-verified reads, delete absent-verification, encryption-before-egress, bounded observability, forced-failure suite"
license = "MIT"

[dependencies]
nexus-artifacts = { path = "../../crates/nexus-artifacts", version = "0.1.0" }
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
# Real Ed25519 manifest signature verification (SPEC-024 req 6 /
# AUD-052). Crypto lives in the adapters (same ring line as the
# live-fire storage harness); the contract crate stays dependency-lean.
ring = "0.17"

[dev-dependencies]
tempfile = "3"
nexus-provider-storage-local = { path = "../storage-local", version = "0.1.0" }
