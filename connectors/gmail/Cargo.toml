[package]
name = "nexus-gmail"
version = "0.1.0"
edition = "2021"
description = "EP-026 M2 Gmail adapter core: real Gmail API HTTP transport against the DOCUMENTED Gmail REST surface, canonical mapping, capability-gated commands, exact-target verification, idempotency, observability (SPEC-014)"
license = "MIT"

[dependencies]
nexus-email = { path = "../../crates/nexus-email", version = "0.1.0" }
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# Real Gmail REST HTTP transport (Gmail is the external provider;
# Nexus normalizes provider payloads at the infrastructure boundary).
# reqwest is the locked workspace dependency class (EP-011/EP-024
# precedent).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query"] }
# base64url encoding for Gmail draft/send raw RFC822 payloads.
base64 = "0.22"
# sha256 digest for Attachment/body evidence (SPEC-014 inputs/outputs;
# nexus-telephony precedent, workspace sha2 0.11 line).
sha2 = "0.11"
