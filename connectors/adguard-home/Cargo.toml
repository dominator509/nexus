[package]
name = "nexus-adguard-connector"
version = "0.1.0"
edition = "2021"
description = "EP-030 M4 AdGuard Home connector: real HTTP transport over the documented AdGuard Home control API (status/querylog/stats/filtering), forced failures, abuse cases, observability (SPEC-013)"
license = "MIT"

[dependencies]
nexus-sentinel = { path = "../../crates/nexus-sentinel", version = "0.1.0" }
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# Real AdGuard Home control API HTTP transport (AdGuard Home is the DNS
# security default per SPEC-013 behavior 2 and COMPONENT_REGISTRY;
# isolated-sidecar integration mode; GPL-3.0). reqwest is the locked
# workspace dependency class (EP-011/EP-024/EP-026/EP-027/EP-028/
# EP-029/EP-030-M2/M3 precedent).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
