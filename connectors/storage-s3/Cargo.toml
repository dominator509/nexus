[package]
name = "nexus-provider-storage-s3"
version = "0.1.0"
edition = "2021"
description = "EP-037 M5 generic S3-compatible ArtifactStore adapter (SPEC-024): explicit compatibility profile (MinIO/SeaweedFS/AWS/R2/B2 protocol targets), AWS SigV4 path-style HTTP/1.1 over std::net, content-addressed with hash-verified reads, delete absent-verification, encryption-before-egress, backup/restore/migration hash gates"
license = "MIT"

[dependencies]
nexus-artifacts = { path = "../../crates/nexus-artifacts", version = "0.1.0" }
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
# Real Ed25519 manifest signature verification (SPEC-024 req 6 /
# AUD-052). Crypto lives in the adapters (same ring line as the
# live-fire storage harness); the contract crate stays dependency-lean.
ring = "0.17"

[dev-dependencies]
tempfile = "3"
nexus-provider-storage-local = { path = "../storage-local", version = "0.1.0" }
