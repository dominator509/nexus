[package]
name = "nexus-provider-storage-local"
version = "0.1.0"
edition = "2021"
description = "EP-037 local filesystem ArtifactStore adapter (SPEC-024): content-addressed, hash-verified, encrypted-before-egress metadata, backup/restore/migration over real filesystem roots"
license = "MIT"

[dependencies]
nexus-artifacts = { path = "../../crates/nexus-artifacts", version = "0.1.0" }
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
