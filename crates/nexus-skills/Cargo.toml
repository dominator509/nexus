[package]
name = "nexus-skills"
version = "0.1.0"
edition = "2021"
description = "EP-018 signed Agent Skills packages, trust, permissions, evals, promotion, composition, versioning (SPEC-010)"
license = "MIT"

[dependencies]
nexus-domain = { path = "../nexus-domain", version = "0.1.0" }
nexus-fabric = { path = "../nexus-fabric", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# Real SHA-256 content hashing for scan-before-install (EP-018 M2).
# Reuses the already-locked workspace dependency class (nexus-sidecar).
sha2 = "0.11"
# Real Ed25519 signature verification (EP-018 M5 / LF-018). Reuses the
# already-locked workspace dependency class (rustls/rcgen already pull
# ring 0.17.14); no new dependency class.
ring = "0.17"
# Real OS sandbox primitives (RX-007 AUD-011): unshare, mount, setuid/
# setgid/setgroups, prctl (no_new_privs + seccomp BPF). Already locked
# in the workspace tree (0.2.189); Linux-only, unix-gated.
libc = "0.2"

[dev-dependencies]
# Hermetic schema validation: EP-018 M3 tests resolve only LOCAL $ref
# targets (draft 2020-12, file/schema references), the same locked
# jsonschema 0.49 class nexus-connectors uses for EP-010 M3
# schema-parity. Test-only, never linked into production binaries.
jsonschema = { version = "0.49", default-features = false, features = ["resolve-file"] }
