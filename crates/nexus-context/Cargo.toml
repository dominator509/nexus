[package]
name = "nexus-context"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EP-016 context engine and memory consolidation crate (SPEC-002): ContextEngine, HybridRetriever, MemoryConsolidator, PrivacyFilter, and GraphExpansionPolicy provider-neutral contracts. Re-exports the canonical memory/context vocabulary from nexus-data, nexus-memory, and nexus-fabric (MemoryRecord, MemoryProposal, MemoryQuery, MemoryCandidate, Sensitivity, RetentionPolicy, ContextCapsule) so callers have a single import surface."

[dependencies]
serde.workspace = true
serde_json.workspace = true
nexus-domain = { path = "../nexus-domain", version = "0.1.0" }
nexus-data = { path = "../nexus-data", version = "0.1.0" }
nexus-memory = { path = "../nexus-memory", version = "0.1.0" }
nexus-fabric = { path = "../nexus-fabric", version = "0.1.0" }

[dev-dependencies]
