[package]
name = "nexus-telephony"
version = "0.1.0"
edition = "2021"
description = "EP-025 provider-neutral telephony contracts: TelephonyProvider, AsteriskProvider, SipCarrierProvider, CallSession, MediaBridge, CallPolicy, DisclosurePolicy, TranscriptArtifact (SPEC-014)"
license = "MIT"

[dependencies]
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# sha256 digest for TranscriptArtifact evidence (M4 directive T/24):
# artifacts carry a digest, never raw transcripts. Aligned with the
# workspace's sha2 0.11 line (nexus-skills/healing/sidecar) so the
# crypto-common/block-buffer stack is NOT duplicated; MIT/Apache-2.0,
# audited by the dependency gate.
sha2 = "0.11"
