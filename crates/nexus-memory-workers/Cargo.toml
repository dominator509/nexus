[package]
name = "nexus-memory-workers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EP-016 memory workers crate (SPEC-002; ADR-023): pure deterministic domain workers implementing ContextEngine, HybridRetriever, MemoryConsolidator, PrivacyFilter, and GraphExpansionPolicy. Permission filtering precedes scoring; purpose limitation is a hard constraint; proposals are never canonical facts; graph expansion is bounded and purpose-aware; telemetry and errors are redacted."

