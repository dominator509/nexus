[package]
name = "nexus-reflex"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EP-014 reflex provider crate (SPEC-009): ReflexProvider port, DeepSeek V4 Flash ReflexProvider adapter, effort tiers, deterministic prompt segments, cache accounting, and NexusControlObject schema validation. Bifrost remains the preferred gateway; DeepSeek V4 Flash is the V1 primary ReflexProvider. Provider credentials never leave the adapter."

[dependencies]
serde.workspace = true
serde_json.workspace = true
nexus-domain = { path = "../nexus-domain", version = "0.1.0" }
nexus-model-gateway = { path = "../nexus-model-gateway", version = "0.1.0" }
# Real OpenAI-compatible HTTP transport (EP-013 M3), pinned ureq. The
# DeepSeek adapter wraps this real transport; no vendor SDK enters this
# crate's tree.
nexus-model-transport = { path = "../../config/models", version = "0.1.0" }

