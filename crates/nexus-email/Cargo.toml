[package]
name = "nexus-email"
version = "0.1.0"
edition = "2021"
description = "EP-026 provider-neutral email contracts: EmailProvider, Mailbox, Thread, Message, Attachment, Draft, SendRequest, MailChangeFeed, MailPolicy (SPEC-014)"
license = "MIT"

[dependencies]
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# sha256 digest for Attachment artifact evidence (SPEC-014 inputs/outputs:
# attachments use ArtifactStore and malware scanning; artifacts carry a
# digest, never raw content). Aligned with the workspace sha2 0.11 line
# (nexus-telephony precedent); MIT/Apache-2.0, audited by the dependency
# gate.
sha2 = "0.11"
