[package]
name = "nexus-connector-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nexus connector SDK contract: Rust/TypeScript/Python SDK surface, sandboxed legacy Connector Sidecar ports, legacy poller, webhook normalizer, and credential broker references (SPEC-022, EP-011)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
nexus-domain = { path = "../nexus-domain", version = "0.1.0" }
nexus-identity = { path = "../nexus-identity", version = "0.1.0" }
nexus-capabilities = { path = "../nexus-capabilities", version = "0.1.0" }

[dev-dependencies]
# Real HTTP transport for the M3 live transport proof (directive C).
# Dev-dependencies do not affect the production dependency tree; the
# dependency-direction gate uses `--edges normal` (EP-010 precedent).
# Loopback-only tests: TLS/rustls default features are NOT enabled
# (keeps the workspace tree free of the unused HTTP/TLS license
# surface; default features would pull webpki-root-certs +
# rustls-platform-verifier + the core-foundation duplicate chain).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
