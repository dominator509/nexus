[package]
name = "nexus-pg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PostgreSQL and pgvector adapters for the provider-neutral data ports (EP-004 M3, RX-005 AUD-007): UnitOfWork, MemoryRepository, WorldGraphRepository, VectorRepository, RepositorySet"

[dependencies]
serde.workspace = true
serde_json.workspace = true
nexus-domain = { path = "../nexus-domain", version = "0.1.0" }
nexus-data = { path = "../nexus-data", version = "0.1.0" }
nexus-events = { path = "../nexus-events", version = "0.1.0" }
postgres = { version = "0.19.14", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1", features = ["v4"] }
