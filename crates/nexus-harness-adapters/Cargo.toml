description = "EP-017 harness adapter implementations (SPEC-010): DeterministicAgentRegistry with capability-based selection, TaskOrchestrator (Nexus parent orchestrator owning task state, budgets, delegations, artifacts), and CliHarnessAdapter implementing the canonical AgentAdapter contract over an injected HarnessCommandRunner port. Pure domain rules; all process I/O is behind the transport port."

