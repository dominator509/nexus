[package]
name = "nexus-notifications-failure-e2e"
version = "0.1.0"
edition = "2021"
description = "EP-032 M4/M5 notification e2e proofs: state-aware escalation, privacy-over-availability, allowlist fail-closed, observability redaction, and M5 live-fire composition over PRODUCTION router + PRODUCTION push/SMS providers (SPEC-014)"
license = "MIT"

[dependencies]
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
nexus-notifications = { path = "../../crates/nexus-notifications", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
nexus-push-connector = { path = "../../connectors/push", version = "0.1.0" }
nexus-sms-connector = { path = "../../connectors/sms", version = "0.1.0" }
rusqlite = { version = "0.32", features = ["bundled"] }
