[package]
name = "nexus-e2e-transport"
version = "0.1.0"
edition = "2021"
description = "EP-040 M3 e2e transport journey: composes the M1 contract suite, the M2 execution core, and the M3 real provider transport into one real end-to-end proof - real container, real SQL, real evidence, real verification, real cleanup (SPEC-008; TESTING.md)"
license = "MIT"

[dependencies]
nexus-test-contract = { path = "../../contract", version = "0.1.0" }
nexus-test-execution = { path = "../../integration", version = "0.1.0" }
nexus-provider-certification = { path = "../../provider-certification", version = "0.1.0" }
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
serde.workspace = true
serde_json.workspace = true
