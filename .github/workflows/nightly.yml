name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  chaos-gate:
    name: EP-040 M5 chaos gate (nightly)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install locked toolchain (mise)
        uses: jdx/mise-action@v2
        with:
          version: 2026.8.5
          install: true
          cache: true

      - name: Install clippy + rustfmt components
        run: rustup component add clippy rustfmt

      - name: Sync Python environment (uv)
        run: uv sync --frozen --extra dev

      - name: Install pinned cargo security tools
        run: |
          if ! cargo-deny --version | grep -F '0.20.2'; then cargo install cargo-deny --locked --version 0.20.2; fi
          if ! cargo-audit --version | grep -F '0.22.2'; then cargo install cargo-audit --locked --version 0.22.2; fi

      - name: Install pinned secrets tools (age, sops)
        run: |
          if ! age --version | grep -F '1.1.1'; then
            curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz -o /tmp/age.tar.gz
            tar -xzf /tmp/age.tar.gz -C /tmp
            sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          fi
          if ! sops --version | grep -F '3.13.0'; then
            curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.0/sops-v3.13.0.linux.amd64 -o /usr/local/bin/sops
            sudo chmod +x /usr/local/bin/sops
          fi

      - name: Prepare CI environment (.env + age key)
        run: |
          cp .env.example .env
          mkdir -p secrets
          age-keygen -o secrets/age-key.txt >/dev/null 2>&1 || true
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY|" .env
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Preflight
        run: sh scripts/preflight.sh

      - name: Blueprint validation
        run: python3 scripts/blueprint_validate.py

      - name: EP-040 M5 gate (chaos live-fire)
        run: sh scripts/ep040-m5-tests.sh

      - name: Scope audit EP-040
        run: sh scripts/scope-audit.sh EP-040

      - name: Expected files EP-040
        run: sh scripts/expected-files.sh EP-040

      - name: Security check
        run: sh scripts/security-check.sh

      - name: Dependency audit
        run: sh scripts/dependency-audit.sh

      - name: License gate
        run: sh scripts/license-gate.sh

      - name: Reality gate
        run: sh scripts/reality-gate.sh

  integration:
    name: Nightly integration (real providers)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install locked toolchain (mise)
        uses: jdx/mise-action@v2
        with:
          version: 2026.8.5
          install: true
          cache: true

      - name: Install clippy + rustfmt components
        run: rustup component add clippy rustfmt

      - name: Sync Python environment (uv)
        run: uv sync --frozen --extra dev

      - name: Resolve Flutter dependencies
        run: |
          for d in apps/mobile packages/mobile-contracts tests/e2e/mobile tests/accessibility/mobile tests/livefire/mobile; do
            if [ -f "$d/pubspec.yaml" ]; then (cd "$d" && flutter pub get); fi
          done

      - name: Install pinned cargo security tools
        run: |
          if ! cargo-deny --version | grep -F '0.20.2'; then cargo install cargo-deny --locked --version 0.20.2; fi
          if ! cargo-audit --version | grep -F '0.22.2'; then cargo install cargo-audit --locked --version 0.22.2; fi

      - name: Install pinned secrets tools (age, sops)
        run: |
          if ! age --version | grep -F '1.1.1'; then
            curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz -o /tmp/age.tar.gz
            tar -xzf /tmp/age.tar.gz -C /tmp
            sudo mv /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          fi
          if ! sops --version | grep -F '3.13.0'; then
            curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.0/sops-v3.13.0.linux.amd64 -o /usr/local/bin/sops
            sudo chmod +x /usr/local/bin/sops
          fi

      - name: Prepare CI environment (.env + age key)
        run: |
          cp .env.example .env
          mkdir -p secrets
          age-keygen -o secrets/age-key.txt >/dev/null 2>&1 || true
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            sed -i "s|^DEEPSEEK_API_KEY=.*|DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY|" .env
          fi
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Preflight
        run: sh scripts/preflight.sh

      - name: Integration tests
        run: sh scripts/test-integration.sh

      - name: Format check
        run: sh scripts/format-check.sh

      - name: Lint
        run: sh scripts/lint.sh

      - name: Typecheck
        run: sh scripts/typecheck.sh
