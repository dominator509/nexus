name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  graphlock-v2:
    name: GraphLock V2 integrity
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Remediation register (90/90 + quarantine)
        run: bash .agent/remediation/verify-remediation-register.sh

  gate:
    name: GraphLock gates
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install locked toolchain (mise)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.8.5
          install: true
          cache: true

      - name: Install pinned cargo security tools
        run: |
          if ! cargo-deny --version | grep -F '0.20.2'; then cargo install cargo-deny --locked --version 0.20.2; fi
          if ! cargo-audit --version | grep -F '0.22.2'; then cargo install cargo-audit --locked --version 0.22.2; fi

      - name: Preflight
        run: sh scripts/preflight.sh

      - name: Blueprint validation
        run: python3 scripts/blueprint_validate.py

      - name: Lint
        run: sh scripts/lint.sh

      - name: Typecheck
        run: sh scripts/typecheck.sh

      - name: Unit tests
        run: sh scripts/test-unit.sh

      - name: Dependency audit
        run: sh scripts/dependency-audit.sh

      - name: Security gate
        run: sh scripts/security-check.sh

      - name: License gate
        run: sh scripts/license-gate.sh

      - name: Reality gate
        run: sh scripts/reality-gate.sh

  integration:
    name: Integration (real PostgreSQL)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install locked toolchain (mise)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.8.5
          install: true
          cache: true

      - name: Preflight
        run: sh scripts/preflight.sh

      - name: Integration tests
        run: sh scripts/test-integration.sh
