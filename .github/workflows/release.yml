name: Release

# Release-integrity CI surface (RX-003 replacement for the EP-042 M1-only
# workflow). Runs the complete verification surface on version tags and
# produces structured release evidence. It never deploys: production
# deployment is not authorized (AGENTS.md stop conditions; promotion remains
# an exact manual action owned by RX-012/RX-013).

on:
  push:
    tags:
      - "v*"

jobs:
  graphlock-v2:
    name: GraphLock V2 integrity
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Remediation register (90/90 + quarantine)
        run: bash .agent/remediation/verify-remediation-register.sh

  release-integrity:
    name: Release integrity
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install locked toolchain (mise)
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.8.5
          install: true
          cache: true

      - name: Preflight
        run: sh scripts/preflight.sh

      - name: Release contract M1 gate
        run: sh scripts/ep042-m1-tests.sh

      - name: Workspace unit battery
        run: sh scripts/test-unit.sh

      - name: Integration tests
        run: sh scripts/test-integration.sh

      - name: Security gate
        run: sh scripts/security-check.sh

      - name: Dependency audit
        run: sh scripts/dependency-audit.sh

      - name: License gate
        run: sh scripts/license-gate.sh

      - name: Reality gate
        run: sh scripts/reality-gate.sh

      - name: Build
        run: sh scripts/build.sh
