# Nexus cargo-deny configuration (EP-001 M5).
#
# Encodes the GREEN license class from LICENSE_POLICY.md: MIT, Apache-2.0,
# BSD, ISC, PostgreSQL, PSF, and equivalent permissive licenses may be
# linked or embedded after security review. cargo-deny rejects everything
# not explicitly allowed, so this list is the policy, not a weakening.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "PostgreSQL",
  "PSF-2.0",
  "Unicode-3.0",
  "Unlicense",
  "0BSD",
]
private = { ignore = true }

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
