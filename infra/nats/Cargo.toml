[package]
name = "nexus-nats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NATS JetStream adapter implementing the nexus-events ports (SPEC-023, EP-005 M2)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
nexus-events = { path = "../../crates/nexus-events", version = "0.1.0" }
async-nats = { version = "0.47.0", default-features = false, features = ["jetstream", "kv", "server_2_12"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
