; EP-025 dialplan: real routing between the controlled PJSIP
; endpoints and the ARI Stasis application.

[internal]
; 100 rings endpoint-a, 101 rings endpoint-b (through real PJSIP
; channel bridging inside Asterisk).
exten => 100,1,Dial(PJSIP/endpoint-a,30,r)
exten => 100,n,Hangup()
exten => 101,1,Dial(PJSIP/endpoint-b,30,r)
exten => 101,n,Hangup()

; Inbound Stasis entry: any caller dialing a 1XX extension is answered
; and moved into the canonical Stasis application (nexus-telephony) so
; the ARI control path (observer/orchestrator) can govern the call.
; The M4/observer surface uses app=nexus-telephony; the old app name
; "nexus" was never subscribed and would strand inbound calls.
exten => _1XX,1,Answer()
exten => _1XX,n,Stasis(nexus-telephony)
exten => _1XX,n,Hangup()
