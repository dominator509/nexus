; EP-025 dialplan: real routing between the controlled PJSIP
; endpoints and the ARI Stasis application.

[internal]
; 100 rings endpoint-a, 101 rings endpoint-b (through real PJSIP
; channel bridging inside Asterisk).
exten => 100,1,Dial(PJSIP/endpoint-a,30,r)
exten => 100,n,Hangup()
exten => 101,1,Dial(PJSIP/endpoint-b,30,r)
exten => 101,n,Hangup()

; Inbound Stasis entry for ARI-originated channels with app=nexus.
exten => _1XX,1,Answer()
exten => _1XX,n,Stasis(nexus)
exten => _1XX,n,Hangup()
