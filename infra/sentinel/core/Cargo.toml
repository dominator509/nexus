nexus-opnsense-connector = { path = "../../../connectors/opnsense", version = "0.1.0" }
nexus-openwrt-connector = { path = "../../../connectors/openwrt", version = "0.1.0" }
nexus-adguard-connector = { path = "../../../connectors/adguard-home", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "lf010_network_diagnosis"
path = "tests/lf010_network_diagnosis.rs"
