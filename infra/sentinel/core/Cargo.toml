[package]
name = "nexus-sentinel-live-fire"
version = "0.1.0"
edition = "2021"
description = "EP-030 M5 LF-010 network-diagnosis live-fire evidence crate"
publish = false

[dependencies]
nexus-domain = { path = "../../../crates/nexus-domain", version = "0.1.0" }
