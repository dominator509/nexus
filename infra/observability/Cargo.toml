[package]
name = "nexus-observability-ops"
version = "0.1.0"
edition = "2021"
description = "EP-038 M4 observability/ops runtime: composes the M1 contracts, M2 writers, and M3 GlitchTip sink; forced-failure proofs, operations diagnostic, and bounded recovery (SPEC-007; node contract)"
license = "MIT"

[dependencies]
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
nexus-observability = { path = "../../crates/nexus-observability", version = "0.1.0" }
nexus-otel = { path = "../otel", version = "0.1.0" }
nexus-glitchtip = { path = "../glitchtip", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
