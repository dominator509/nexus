#cloud-config
# EP-036 Nexus node bootstrap (SPEC-016).
#
# Cloud-init establishes ONLY bootstrap identity and pulls signed
# releases (node contract). It never installs arbitrary software, never
# carries cloud credentials, and never marks a resource VERIFIED.
#
# Bootstrap identity: the operator-provided SSH key is injected as the
# only bootstrap principal. The signed release pull is a stub reference
# owned by the release/update milestone; cloud-init only prepares the
# state directory and records the signed manifest URL for the next stage.

ssh_authorized_keys:
  - __NEXUS_BOOTSTRAP_PUBKEY__

write_files:
  - path: /etc/nexus/bootstrap/state.json
    content: |
      {
        "bootstrap": "identity-established",
        "signed_release_url": "https://releases.nexus.local/stable/latest.manifest.sig",
        "verified": false
      }
    owner: root:root
    permissions: "0600"

runcmd:
  - mkdir -p /etc/nexus/bootstrap /var/lib/nexus
  - chmod 0700 /etc/nexus/bootstrap
