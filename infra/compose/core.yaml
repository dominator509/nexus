# Nexus Control Plane Runtime - local core profile (EP-044).
#
# The real control-plane binary built from apps/control-plane and run as
# the canonical local core service. Health/readiness are exposed on the
# host port so the runtime smoke (scripts/smoke/runtime.sh) can probe
# them deterministically.
services:
  control-plane:
    build:
      context: ../..
      dockerfile: apps/control-plane/Dockerfile
    image: nexus-control-plane:local
    container_name: nexus-control-plane
    environment:
      NEXUS_BASE_DOMAIN: "${NEXUS_BASE_DOMAIN:-nexus.test}"
      NEXUS_SMOKE_URL: "${NEXUS_SMOKE_URL:-http://127.0.0.1:8443}"
      NEXUS_CONTROL_PLANE_BIND: "0.0.0.0:8443"
      NEXUS_TENANT_ID: "018f0f6f-9c1e-7b6e-8000-000000000001"
      NEXUS_CAPABILITY_SOURCE: "core"
    ports:
      - "8443:8443"
    restart: "no"
