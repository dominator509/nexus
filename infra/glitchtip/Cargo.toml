[package]
name = "nexus-glitchtip"
version = "0.1.0"
edition = "2021"
description = "EP-038 M3 GlitchTip/Sentry-compatible incident sink: DSN handling, Sentry envelope serialization, std::net transport with real TLS for https DSNs, and M1 IncidentSink integration with redaction-before-egress (SPEC-007; node contract)"
license = "MIT"

[dependencies]
nexus-domain = { path = "../../crates/nexus-domain", version = "0.1.0" }
nexus-observability = { path = "../../crates/nexus-observability", version = "0.1.0" }
serde_json = "1.0"
# TLS for https DSNs (AUD-055): the DSN scheme must actually negotiate
# TLS. Pinned to the locked workspace rustls 0.23 chain (ring provider,
# matched to infra/pki) so the sink and the mTLS adapter share the same
# TLS implementation.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.9"

[dev-dependencies]
nexus-otel = { path = "../otel", version = "0.1.0" }
# Real TLS server for the positive TLS handshake proof: the test spins
# up a rustls server with a self-signed certificate and proves an https
# DSN delivers over an actual encrypted connection (rcgen for the test
# key/cert; same locked chain as infra/pki).
rcgen = "0.14.9"
