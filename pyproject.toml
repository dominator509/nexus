[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-contracts"
version = "0.1.0"
description = "Nexus generated cross-language contracts"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "psycopg[binary]>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["python/nexus_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/failure"]
python_functions = ["test_*", "ep001_unit_*", "ep001_integration_*", "ep001_failure_*", "ep002_unit_*", "ep002_integration_*", "ep002_failure_*"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["python/nexus_contracts/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["python/nexus_contracts/generated.py"]

[tool.uv]
package = true
